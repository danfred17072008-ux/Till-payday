name: Build Till Payday Play AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36"

      - name: Unzip Till Payday
        run: |
          unzip -o TillPayday_Android_v0_2_PlayReady.zip -d android-project

      - name: Force correct Play Store package name
        run: |
          GRADLE_FILE=$(find android-project -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | grep "/app/" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "Could not find the app Gradle file"
            exit 1
          fi

          echo "Editing: $GRADLE_FILE"

          if [[ "$GRADLE_FILE" == *.kts ]]; then
            sed -i -E 's/applicationId[[:space:]]*=[[:space:]]*"[^"]+"/applicationId = "com.danfredtaylor.tillpayday"/' "$GRADLE_FILE"
            sed -i -E 's/namespace[[:space:]]*=[[:space:]]*"[^"]+"/namespace = "com.danfredtaylor.tillpayday"/' "$GRADLE_FILE"
          else
            sed -i -E "s/applicationId[[:space:]]+['\"][^'\"]+['\"]/applicationId 'com.danfredtaylor.tillpayday'/" "$GRADLE_FILE"
            sed -i -E "s/namespace[[:space:]]+['\"][^'\"]+['\"]/namespace 'com.danfredtaylor.tillpayday'/" "$GRADLE_FILE"
          fi

          echo "Package details:"
          grep -nE "applicationId|namespace" "$GRADLE_FILE"

          PROJECT_DIR=$(dirname "$(dirname "$GRADLE_FILE")")
          echo "$PROJECT_DIR" > /tmp/project_dir

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Play Store AAB
        run: |
          PROJECT_DIR=$(cat /tmp/project_dir)
          cd "$PROJECT_DIR"
          gradle bundleRelease

      - name: Upload Till Payday AAB
        uses: actions/upload-artifact@v4
        with:
          name: TillPayday-PlayStore-AAB
          path: android-project/**/app/build/outputs/bundle/release/app-release.aab
