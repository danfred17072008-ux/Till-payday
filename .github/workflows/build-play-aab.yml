name: Build Till Payday Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unzip Till Payday
        run: |
          rm -rf TillPayday_Android_v0_2
          unzip -o TillPayday_Android_v0_2_PlayReady.zip

      - name: Set correct package name
        run: |
          cd TillPayday_Android_v0_2
          sed -i 's/com\.tillpayday\.app/com.danfredtaylor.tillpayday/g' app/build.gradle || true
          sed -i 's/com\.tillpayday\.app/com.danfredtaylor.tillpayday/g' app/build.gradle.kts || true
          grep -R "com.danfredtaylor.tillpayday" app || true

      - name: Make Gradle executable
        run: |
          cd TillPayday_Android_v0_2
          chmod +x gradlew

      - name: Build release AAB
        run: |
          cd TillPayday_Android_v0_2
          ./gradlew bundleRelease --stacktrace

      - name: Find built AAB
        run: |
          find TillPayday_Android_v0_2 -type f -name "*.aab" -print

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TillPayday-Play-AAB
          path: TillPayday_Android_v0_2/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
