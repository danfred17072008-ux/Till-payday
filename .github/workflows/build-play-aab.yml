name: Build Till Payday Play AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36"

      - name: Unzip Till Payday
        run: unzip TillPayday_Android_v0_2_PlayReady.zip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Download signing key
        uses: actions/download-artifact@v4
        with:
          name: TillPayday-Signing-Key
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32298731672
          path: signing

      - name: Build signed Play Store AAB
        run: |
          cd TillPayday_Android_v0_2
          gradle bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing/till
