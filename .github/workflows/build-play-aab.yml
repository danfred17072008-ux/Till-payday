name: Build Till Payday Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version

      - name: Install Android 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36"

      - name: Unzip Till Payday
        run: |
          rm -rf TillPayday_Android_v0_2
          unzip -o TillPayday_Android_v0_2_PlayReady.zip

      - name: Set correct package name
        run: |
          cd TillPayday_Android_v0_2
          grep -RIl "com.tillpayday.app" . | xargs -r sed -i 's/com\.tillpayday\.app/com.danfredtaylor.tillpayday/g'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release AAB
        run: |
          cd TillPayday_Android_v0_2
          gradle bundleRelease --stacktrace

      - name: Find built AAB
        run: |
          echo "AAB files:"
          find TillPayday_Android_v0_2 -type f -name "*.aab" -print

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TillPayday-PlayStore-AAB
          path: TillPayday_Android_v0_2/**/build/outputs/bundle/release/*.aab
          if-no-files-found: error
