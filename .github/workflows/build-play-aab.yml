name: Build Till Payday Play AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36"

      - name: Unzip Till Payday
        run: unzip -o TillPayday_Android_v0_2_PlayReady.zip

      - name: Fix package name for Play Store
        run: |
          GRADLE_FILE=$(find . -path "*/app/build.gradle" -print -quit)
          echo "Found Gradle file: $GRADLE_FILE"
          test -n "$GRADLE_FILE"
          sed -i 's/applicationId "[^"]*"/applicationId "com.danfredtaylor.tillpayday"/' "$GRADLE_FILE"
          sed -i "s/applicationId '[^']*'/applicationId 'com.danfredtaylor.tillpayday'/" "$GRADLE_FILE"
          grep applicationId "$GRADLE_FILE"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Play Store AAB
        run: gradle bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TillPayday-PlayStore-AAB
          path: app/build/outputs/bundle/release/app-release.aab
