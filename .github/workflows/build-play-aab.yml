name: Build Till Payday Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unzip Till Payday
        run: unzip -o TillPayday_Android_v0_2_PlayReady.zip

      - name: Set correct package name
        run: |
          grep -RIl "com.tillpayday.app" TillPayday_Android_v0_2 | \
          xargs -r sed -i 's/com\.tillpayday\.app/com.danfredtaylor.tillpayday/g'

      - name: Build release AAB
        run: |
          cd TillPayday_Android_v0_2
          gradle bundleRelease

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > tillpayday-release.jks

      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          AAB_PATH=$(find TillPayday_Android_v0_2/app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          cp "$AAB_PATH" TillPayday-SIGNED.aab

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore tillpayday-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            TillPayday-SIGNED.aab \
            tillpayday

      - name: Verify signed AAB
        run: |
          jarsigner -verify -verbose -certs TillPayday-SIGNED.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: TillPayday-PlayStore-Signed-AAB
          path: TillPayday-SIGNED.aab
