name: Build Till Payday Play AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36"

      - name: Unzip Till Payday
        run: unzip -o TillPayday_Android_v0_2_PlayReady.zip -d TillPayday

      - name: Set correct package name
        run: |
          cd TillPayday/TillPayday_Android_v0_2
          sed -i 's/applicationId "[^"]*"/applicationId "com.danfredtaylor.tillpayday"/' app/build.gradle

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > TillPayday/TillPayday_Android_v0_2/tillpayday-release.jks

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build signed Play Store AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd TillPayday/TillPayday_Android_v0_2
          gradle bundleRelease \
            -Pandroid.injected.signing.store.file="$PWD/tillpayday-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify AAB signature
        run: |
          jarsigner -verify -verbose -certs TillPayday/TillPayday_Android_v0_2/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: TillPayday-PlayStore-Signed-AAB
          path: TillPayday/TillPayday_Android_v0_2/app/build/outputs/bundle/release/app-release.aab
