name: Build Till Payday Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Till Payday
        run: unzip -o TillPayday_Android_v0_2_PlayReady.zip

      - name: Check project
        run: |
          cd TillPayday_Android_v0_2
          ls -la
          chmod +x gradlew

      - name: Build release AAB
        run: |
          cd TillPayday_Android_v0_2
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TillPayday-Play-AAB
          path: TillPayday_Android_v0_2/app/build/outputs/bundle/release/*.aab
