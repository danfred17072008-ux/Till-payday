name: Build Till Payday Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36"

      - name: Unzip Till Payday
        run: |
          unzip -o TillPayday_Android_v0_2_PlayReady.zip

      - name: Check project
        run: |
          cd TillPayday_Android_v0_2
          ls -la
          chmod +x gradlew

      - name: Build release AAB
        run: |
          cd TillPayday_Android_v0_2
          ./gradlew clean bundleRelease --stacktrace

      - name: Find built AAB
        run: |
          find TillPayday_Android_v0_2 -type f -name "*.aab" -print

      - name: Upload Till Payday AAB
        uses: actions/upload-artifact@v4
        with:
          name: TillPayday-Play-AAB
          path: TillPayday_Android_v0_2/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
