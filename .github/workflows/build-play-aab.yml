name: Build Till Payday Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Till Payday
        run: |
          rm -rf TillPayday_Android_v0_2
          unzip -o TillPayday_Android_v0_2_PlayReady.zip

      - name: Set correct Play Store package
        run: |
          cd TillPayday_Android_v0_2
          sed -i 's/com\.tillpayday\.app/com.danfredtaylor.tillpayday/g' app/build.gradle
          find app/src -type f -name "*.java" -exec sed -i 's/com\.tillpayday\.app/com.danfredtaylor.tillpayday/g' {} \;
          find app/src -type f -name "*.xml" -exec sed -i 's/com\.tillpayday\.app/com.danfredtaylor.tillpayday/g' {} \;

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create Gradle wrapper
        working-directory: TillPayday_Android_v0_2
        run: gradle wrapper --gradle-version 8.13

      - name: Make Gradle executable
        run: chmod +x TillPayday_Android_v0_2/gradlew

      - name: Build release AAB
        working-directory: TillPayday_Android_v0_2
        run: ./gradlew clean bundleRelease --stacktrace --no-daemon

      - name: Find built AAB
        run: |
          echo "=== FINISHED AAB ==="
          find TillPayday_Android_v0_2 -type f -name "*.aab" -print

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TillPayday-Play-AAB
          path: TillPayday_Android_v0_2/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
