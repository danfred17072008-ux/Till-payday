name: Build Till Payday Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36"

      - name: Unzip Till Payday
        run: unzip -o TillPayday_Android_v0_2_PlayReady.zip

      - name: Set correct package name
        run: |
          cd TillPayday_Android_v0_2
          sed -i 's/com\.tillpayday\.app/com.danfredtaylor.tillpayday/g' app/build.gradle
          grep -R "com.danfredtaylor.tillpayday" app/build.gradle || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release AAB
        run: |
          cd TillPayday_Android_v0_2
          gradle bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TillPayday-PlayStore-AAB
          path: TillPayday_Android_v0_2/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
