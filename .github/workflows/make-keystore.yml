name: Make Till Payday Signing Key

on:
  workflow_dispatch:

jobs:
  make-key:
    runs-on: ubuntu-latest

    steps:
      - name: Create signing key
        run: |
          keytool -genkeypair \
            -keystore tillpayday-upload.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias tillpayday \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Till Payday, O=Till Payday, C=GB"

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: TillPayday-Signing-Key
          path: tillpayday-upload.jks
