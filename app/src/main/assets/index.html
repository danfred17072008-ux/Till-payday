<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Till Payday</title>

<style>
:root{
  --bg:#f4f2ed;
  --card:#ffffff;
  --ink:#151515;
  --muted:#6d6a64;
  --line:#dedbd4;
  --green:#176b3a;
  --green2:#eaf4ed;
  --amber:#925800;
  --amber2:#fff5df;
  --red:#9d2828;
  --red2:#fdecec;
  --shadow:0 6px 24px rgba(0,0,0,.06);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* WELCOME SCREEN */

#welcome{
  position:fixed;
  inset:0;
  z-index:9999;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.welcome-card{
  width:100%;
  max-width:480px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:30px;
  padding:34px 24px;
  text-align:center;
  box-shadow:var(--shadow);
}

.logo-circle{
  width:86px;
  height:86px;
  margin:0 auto 18px;
  border-radius:24px;
  background:var(--green);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:34px;
  letter-spacing:-2px;
}

.welcome-card h1{
  margin:0;
  font-size:38px;
  letter-spacing:-1.5px;
}

.welcome-tag{
  margin:8px 0 26px;
  color:var(--muted);
  font-size:18px;
}

.welcome-button{
  width:100%;
  border:0;
  border-radius:18px;
  background:var(--ink);
  color:#fff;
  padding:18px;
  font-weight:800;
  font-size:18px;
}

.welcome-small{
  margin-top:15px;
  color:var(--muted);
  font-size:13px;
}

/* MAIN */

main{
  max-width:600px;
  margin:auto;
  padding:calc(18px + env(safe-area-inset-top)) 14px 50px;
}

header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:14px;
  margin:2px 2px 16px;
}

header h1{
  margin:0;
  font-size:30px;
  letter-spacing:-1px;
}

.tagline{
  color:var(--muted);
  margin-top:3px;
  font-size:14px;
}

.version{
  color:var(--muted);
  font-size:12px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}

.eyebrow{
  text-transform:uppercase;
  letter-spacing:1.6px;
  font-weight:800;
  color:var(--muted);
  font-size:12px;
  margin-bottom:7px;
}

h2{
  margin:0 0 8px;
  font-size:22px;
  letter-spacing:-.5px;
}

h3{
  margin:0 0 8px;
}

p{
  line-height:1.45;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
  color:var(--muted);
}

input,select{
  width:100%;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fff;
  padding:14px 15px;
  color:var(--ink);
  outline:none;
  font-size:16px;
}

input:focus,select:focus{
  border-color:#999;
}

label{
  display:block;
  font-size:14px;
  font-weight:750;
  margin-bottom:7px;
}

.field{
  margin-top:14px;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.btn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:14px 16px;
  background:var(--ink);
  color:#fff;
  font-weight:800;
  margin-top:12px;
}

.btn.secondary{
  background:#eeeae3;
  color:var(--ink);
}

.btn.green{
  background:var(--green);
}

.btn.small-btn{
  width:auto;
  padding:9px 12px;
  margin:0;
  font-size:13px;
}

.hero{
  text-align:center;
  padding:24px 18px;
}

.hero-money{
  font-size:48px;
  font-weight:900;
  letter-spacing:-2px;
  margin:4px 0;
}

.summary{
  font-size:16px;
  color:var(--muted);
  margin-top:4px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.stat{
  background:#f8f7f3;
  border:1px solid var(--line);
  border-radius:17px;
  padding:14px;
  text-align:left;
}

.stat-label{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:800;
}

.stat-value{
  font-size:24px;
  font-weight:900;
  margin-top:5px;
}

.bill-add{
  display:grid;
  grid-template-columns:1fr 110px;
  gap:8px;
}

.bill-item,.spend-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  background:#f8f7f3;
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px 13px;
  margin-top:8px;
}

.bill-name,.spend-name{
  font-weight:800;
}

.remove{
  border:0;
  background:#ebe8e2;
  border-radius:11px;
  padding:8px 10px;
  font-weight:750;
}

.result{
  margin-top:12px;
  padding:14px;
  border-radius:15px;
  background:#f8f7f3;
  line-height:1.45;
}

.good{
  background:var(--green2);
  color:var(--green);
}

.warn{
  background:var(--amber2);
  color:var(--amber);
}

.bad{
  background:var(--red2);
  color:var(--red);
}

/* PRO */

.pro-card{
  border:2px solid #d6b34e;
  background:linear-gradient(180deg,#fffdf7,#fff);
}

.pro-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.crown{
  font-size:25px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:12px 0;
}

.badge{
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 9px;
  font-size:11px;
  font-weight:750;
  background:#faf9f6;
}

.price{
  font-size:14px;
  font-weight:800
